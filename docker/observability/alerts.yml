# AI Town 告警规则 - 核心链路可用性与成本
#
# 挂载方式见 docker-compose.yml prometheus 服务卷：
#   ./docker/observability/alerts.yml:/etc/prometheus/rules/alerts.yml:ro
#
# 分级约定：
#   critical - 数据损坏 / 功能阻断（世界停摆、Redis 断连、熔断打开）
#   warning  - 性能退化 / 需要关注的趋势（错误率上升、预算消耗过快）

groups:
  # ============================================================
  # 世界引擎
  # ============================================================
  - name: world-engine
    rules:
      - alert: WorldTickStalled
        expr: |
          increase(ai_town_world_tick_total[5m]) == 0
          and on() ai_town_redis_connected == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "World Tick 停摆超过 5 分钟"
          description: "近 5 分钟无任何 World Tick 执行且 Redis 正常，World Engine 可能崩溃或 Leader 丢失。"

      - alert: WorldTickHighErrorRate
        expr: |
          rate(ai_town_world_tick_errors_total[10m])
            / clamp_min(rate(ai_town_world_tick_total[10m]), 0.001) > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "World Tick 错误率超过 20%"
          description: "过去 10 分钟 World Tick 错误占比 {{ $value | humanizePercentage }}，检查演化器日志。"

  # ============================================================
  # 角色 Tick / Action 执行
  # ============================================================
  - name: character-tick
    rules:
      - alert: CharacterTickHighFailureRate
        expr: |
          sum(rate(ai_town_character_tick_errors_total[10m]))
            / clamp_min(sum(rate(ai_town_character_tick_total[10m])), 0.001) > 0.3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "角色 Tick 失败率超过 30%"
          description: "持续 10 分钟高于阈值（当前 {{ $value | humanizePercentage }}），常见原因：LLM 故障、锁竞争、PG 写入失败。"

      - alert: ActionExecutionFailuresSpiking
        expr: |
          sum(rate(ai_town_action_execution_total{status="failed"}[10m])) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Action 执行失败速率异常"
          description: "每秒失败数 {{ $value | humanize }} 持续 10 分钟，检查 executor 与 MovementSystem 校验日志。"

  # ============================================================
  # LLM 成本与可用性
  # ============================================================
  - name: llm-cost
    rules:
      - alert: LLMDailyBudgetNearExhausted
        # 阈值随配置缩放：ai_town_llm_daily_budget_usd 是后端启动时按
        # settings.llm_daily_budget_usd 暴露的 Gauge，调整 LLM_DAILY_BUDGET_USD
        # 后重启即自动生效，告警不再硬编码金额。
        #
        # 口径近似说明（为什么用 increase([24h])）：ai_town_llm_cost_total_usd
        # 是进程启动以来的累计 Counter，不会按日清零；而预算台账（Redis 按 UTC
        # 日期分 key）每日归零。用滚动 24h 增量近似「当日花费」有两个已知偏差：
        #   1. UTC 午夜刚过时窗口仍含昨日晚间花费 → 偏早报（保守方向，可接受）；
        #   2. 进程重启会丢失重启前的历史增量 → 偏漏报，由后端 BudgetManager
        #      的硬熔断与 CircuitBreakerStuckSuspect 兜底。
        expr: |
          increase(ai_town_llm_cost_total_usd[24h])
            > 0.8 * ai_town_llm_daily_budget_usd
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "滚动 24 小时 LLM 花费超过当前日预算的 80%"
          description: "当前滚动 24h 花费 ${{ $value | humanize }}，阈值随 LLM_DAILY_BUDGET_USD 配置缩放；预算管理器即将触发熔断，Tick 会开始跳过。"

      - alert: LLMCallFailureRateHigh
        expr: |
          sum(rate(ai_town_llm_call_total{status="failed"}[10m]))
            / clamp_min(sum(rate(ai_town_llm_call_total[10m])), 0.001) > 0.3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "LLM 调用失败率超过 30%"
          description: "多模型备用源可能全部进入冷却；检查 LLM_FALLBACK_SOURCES 各源状态与余额。"

      - alert: CircuitBreakerStuckSuspect
        expr: |
          sum(increase(ai_town_llm_call_total[15m])) == 0
          and on() ai_town_active_characters > 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "有活跃角色但 15 分钟内零 LLM 调用"
          description: "疑似熔断器卡在 OPEN 或预算已打满，角色 Tick 全部跳过中。"

  # ============================================================
  # 状态一致性（对账）
  # ============================================================
  - name: state-consistency
    rules:
      - alert: ReconcileDriftDetected
        expr: |
          increase(ai_town_reconcile_drift_total[30m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "对账发现 Redis/PG 状态漂移（已自动修复）"
          description: "过去 30 分钟发现 {{ $value }} 次漂移。偶发属双写失败的正常修复；频繁出现说明双写路径有问题，检查 reconcile_drift_detected 日志中的 character_id 与字段。"

      - alert: RedisDisconnected
        expr: ai_town_redis_connected == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis 连接断开"
          description: "实时状态真相源不可用，所有状态写入静默丢失中。"

  # ============================================================
  # HTTP 服务健康
  # ============================================================
  - name: http-health
    rules:
      - alert: HTTP5xxRateHigh
        expr: |
          sum(rate(ai_town_http_request_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(ai_town_http_request_total[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HTTP 5xx 错误率超过 5%"
          description: "过去 5 分钟 5xx 占比 {{ $value | humanizePercentage }}。"

      - alert: BackendScrapeDown
        expr: up{job="ai-town-backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "后端 /metrics 抓取失败超过 2 分钟"
          description: "后端进程可能已退出或端口不通。"

  # ============================================================
  # 告警链路自监控（Alertmanager → 后端 webhook 回流）
  # ============================================================
  - name: alerting-pipeline
    rules:
      # 为什么监控投递失败计数：告警经 webhook 回流后端（ai_town_alerts_received_total）
      # 是唯一落地通道，token 配错（403）、网络不通、webhook 报错时投递会静默失败——
      # 若不监控 alertmanager 自身的失败指标，「告警发不出去」这件事将永远无人知晓。
      - alert: AlertmanagerDeliveryFailing
        expr: increase(alertmanager_notifications_failed_total[15m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Alertmanager 告警投递失败"
          description: "过去 15 分钟 {{ $value | humanize }} 次投递失败，后端 webhook 可能收不到任何告警。优先检查 ALERT_WEBHOOK_TOKEN 与后端配置是否一致（403）及 backend 容器网络连通性。"

      # 金丝雀规则（R5-L15b 备选：AlertsWebhookSilent，1h 零接收 + 有 firing 告警）的取舍：
      # 该方案依赖 ai_town_alerts_received_total 已存在，但后端收到第一条告警前此序列不存在，
      # PromQL 对缺失序列聚合返回空向量，== 0 判定为假——恰好漏掉最需要它的冷启动场景；
      # 且现实故障模式（403/断网/接口报错）都会让上面的 AlertmanagerDeliveryFailing 先行触发，
      # 金丝雀没有独立覆盖面，故不实现。Alertmanager 进程整体宕机时其指标全部消失，
      # 可通过 Prometheus Targets 页面的 up{job="alertmanager"} 观察。
