# Alertmanager 配置 - AI Town 告警通知路由
#
# R4-M2：默认 receiver 接入后端 webhook（/api/v1/system/alerts/webhook），
# 告警经结构化日志 + ai_town_alerts_received_total 指标双通道落地，
# 不再只进 Grafana UI。bearer_token 占位符由 compose 启动时用
# ALERT_WEBHOOK_TOKEN 环境变量替换（与后端 settings.alert_webhook_token 一致）。

route:
  receiver: default
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default
    webhook_configs:
      - url: http://backend:8000/api/v1/system/alerts/webhook
        http_config:
          bearer_token: __ALERT_WEBHOOK_TOKEN__

# 接入额外通知渠道示例（飞书/邮件等）：
