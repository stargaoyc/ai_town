# packages/frontend/nginx.conf
# Nginx 配置 - 前端静态文件 + API/WebSocket 反向代理
# 容器以非 root 用户（nginx, uid 101）运行，监听非特权端口 8080（审查 §10.1）

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker 内嵌 DNS：backend 容器重建后 IP 会变，静态 proxy_pass 只在启动时
    # 解析一次会导致 502；改用变量 + resolver 让每次请求动态解析（10s 缓存）
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $backend_upstream http://backend:8000;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # 请求体上限（防大包滥用；API 仅接收 JSON/常规表单）
    client_max_body_size 10m;

    # 安全响应头
    # 注意 nginx 继承规则：location 内出现任意 add_header 时不再继承 server 级头部，
    # 因此 /assets/ location 需重复声明（少量重复优于隐式抽象）
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' ws: wss:; font-src 'self' data:" always;

    # 静态资源缓存（Vite 构建产物带 hash，可长期缓存）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' ws: wss:; font-src 'self' data:" always;
    }

    # SPA 路由回退（TanStack Router 的客户端路由）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 健康检查端点（总览页轮询 /health，未带 /api 前缀，需单独代理）
    location = /health {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
    }

    # API 反向代理
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket 反向代理（Web 聊天）
    location /ws/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # /metrics 不对公网暴露：Prometheus 经 compose 内网直接抓取 backend 容器
    # （docker/observability/prometheus.yml → backend:8000），此处一律 404
    location /metrics {
        return 404;
    }
}
