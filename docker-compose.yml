# docker-compose.yml - AI Town 统一编排（唯一真相源）
#
# 基础设施配置与 docker-compose-win.infra.yml（已合并删除）对齐：
# pgvector/pgvector:pg18 官方镜像（迁移链依赖 PG18 内建 uuidv7()）、
# bind mount ./data/*、端口 PG=5433。
#
# 使用方法：
#   1. 复制 .env.example 为 .env 并填写配置。POSTGRES_PASSWORD / REDIS_PASSWORD 为必填项
#      （${VAR:?} 插值校验，缺失时 compose 直接报错拒绝启动）；启用 observability profile
#      还需 GRAFANA_ADMIN_PASSWORD。
#   2. docker compose up -d              # 全栈（PG/Redis/后端/前端）
#
# 分层启动：
#   docker compose up -d postgres redis   # 仅基础设施（本地开发）
#   docker compose --profile observability up -d   # 加可观测性
#   docker compose --profile backup up -d          # 加数据库定时备份
#
# 端口暴露策略：基础设施与可观测性端口一律绑定 127.0.0.1 回环（不对局域网/公网暴露）；
# backend/frontend 保持常规发布便于本地开发——生产部署应同样收紧为 127.0.0.1 或前置网关。

# 日志轮转：json-file 驱动 + 单文件上限，防止容器日志无限增长吃满磁盘
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ============================================================
  # 基础设施层
  # ============================================================

  postgres:
    image: pgvector/pgvector:pg18
    container_name: aitown-postgres
    restart: unless-stopped
    environment:
      # 凭据经变量插值（compose 自动读根目录 .env）；:? 强制必填，缺失即启动失败
      POSTGRES_DB: ai_town
      POSTGRES_USER: ai_town
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_required}
      TZ: Asia/Shanghai
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_town"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    networks:
      - aitown-net

  redis:
    image: redis:8-alpine # 与 README/CI 对齐的大版本固定 tag，避免浮动漂移
    container_name: aitown-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./data/redis:/data
    # requirepass 强制密码访问（:? 缺失即启动失败）；同时开启 AOF 持久化
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD_required}"]
    healthcheck:
      # requirepass 后 ping 必须带认证，否则 NOAUTH 会让 healthcheck 误报 unhealthy
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      TZ: Asia/Shanghai
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD_required} # 供 healthcheck 认证
    logging: *default-logging
    networks:
      - aitown-net

  # ============================================================
  # 应用层
  # ============================================================

  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    container_name: aitown-backend
    restart: unless-stopped
    env_file:
      - path: .env # 根目录 .env（生产部署）；本地仅起基础设施时可以没有
        required: false
    environment:
      # 与 postgres 服务共用 POSTGRES_PASSWORD 变量，消除 .env/compose 双真相源；密码缺失即 fail-fast
      DATABASE_URL: postgresql+asyncpg://ai_town:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_required}@postgres:5432/ai_town
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD_required}@redis:6379/0
      TZ: Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000" # 开发便利保留常规发布；生产应改绑 127.0.0.1 或仅经前端反代访问
    volumes:
      - ./data/logs:/app/data/logs
      # Prompt 模板与节日日历（fail-fast 配置）：容器镜像只含 packages/backend，
      # configs/ 在仓库根，必须挂载进容器
      - ./configs:/app/configs:ro
    logging: *default-logging
    networks:
      - aitown-net

  frontend:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile
    container_name: aitown-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:8080" # 容器内 nginx 以非 root 用户监听 8080（审查 §10.1）；生产建议同样收紧来源或前置网关
    logging: *default-logging
    networks:
      - aitown-net

  # 数据库定时备份（通过 --profile backup 启用）
  db-backup:
    image: pgvector/pgvector:pg18
    container_name: aitown-db-backup
    restart: unless-stopped
    profiles: [backup]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_required}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-6}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      TZ: Asia/Shanghai
    volumes:
      - ./docker/backup/backup.sh:/backup.sh:ro
      - ./data/backups:/backups
    entrypoint: ["sh", "/backup.sh"]
    logging: *default-logging
    networks:
      - aitown-net

  # ============================================================
  # 可观测性层（通过 --profile observability 启用）
  # ============================================================

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: aitown-prometheus
    restart: unless-stopped
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/observability/alerts.yml:/etc/prometheus/rules/alerts.yml:ro
      - ./data/prometheus:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    environment:
      TZ: Asia/Shanghai
    logging: *default-logging
    networks:
      - aitown-net
    profiles: [observability]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: aitown-alertmanager
    restart: unless-stopped
    volumes:
      - ./docker/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"
    environment:
      TZ: Asia/Shanghai
    logging: *default-logging
    networks:
      - aitown-net
    profiles: [observability]

  loki:
    image: grafana/loki:3.0.0
    container_name: aitown-loki
    restart: unless-stopped
    volumes:
      - ./docker/observability/loki-config.yml:/etc/loki/local-config.yaml:ro
      - ./data/loki:/loki
    ports:
      - "127.0.0.1:3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    environment:
      TZ: Asia/Shanghai
    logging: *default-logging
    networks:
      - aitown-net
    profiles: [observability]

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: aitown-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:16686:16686" # Jaeger UI
      - "127.0.0.1:14318:4318" # OTLP HTTP
    logging: *default-logging
    networks:
      - aitown-net
    profiles: [observability]

  alloy:
    image: grafana/alloy:v1.0.0
    container_name: aitown-alloy
    restart: unless-stopped
    volumes:
      # 仅文件采集（容器日志 + 后端日志目录），不挂载 docker.sock 以缩小攻击面
      - ./docker/observability/alloy.config.alloy:/etc/alloy/config.alloy:ro
      - ./data/logs:/var/log/aitown:ro
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    ports:
      - "127.0.0.1:12345:12345"
    environment:
      TZ: Asia/Shanghai
    depends_on:
      - loki
    logging: *default-logging
    networks:
      - aitown-net
    profiles: [observability]

  grafana:
    image: grafana/grafana:12.0.0
    container_name: aitown-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD_required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: ""
      TZ: Asia/Shanghai
    volumes:
      - ./docker/observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/observability/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./docker/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./data/grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - loki
      - jaeger
    logging: *default-logging
    networks:
      - aitown-net
    profiles: [observability]

networks:
  aitown-net:
    driver: bridge
