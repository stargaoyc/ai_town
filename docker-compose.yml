# docker-compose.yml - AI Town 统一编排（唯一真相源）
#
# 基础设施配置与 docker-compose-win.infra.yml（已合并删除）对齐：
# pgvector/pgvector:pg18 官方镜像（迁移链依赖 PG18 内建 uuidv7()）、
# bind mount ./data/*、端口 PG=5433。
#
# 使用方法：
#   1. 复制 .env.example 为 .env 并填写配置
#   2. docker compose up -d              # 全栈（PG/Redis/后端/前端）
#
# 分层启动：
#   docker compose up -d postgres redis   # 仅基础设施（本地开发）
#   docker compose --profile observability up -d   # 加可观测性

services:
  # ============================================================
  # 基础设施层
  # ============================================================

  postgres:
    image: pgvector/pgvector:pg18
    container_name: aitown-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_town
      POSTGRES_USER: ai_town
      POSTGRES_PASSWORD: password
      TZ: Asia/Shanghai
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_town"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aitown-net

  redis:
    image: redis:alpine # 使用稳定的 Alpine 版本，避免 8.0-alpine 拉取失败
    container_name: aitown-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    command: redis-server --appendonly yes # 开启 AOF 持久化
    environment:
      TZ: Asia/Shanghai
    networks:
      - aitown-net

  # ============================================================
  # 应用层
  # ============================================================

  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    container_name: aitown-backend
    restart: unless-stopped
    env_file:
      - path: .env # 根目录 .env（生产部署）；本地仅起基础设施时可以没有
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://ai_town:password@postgres:5432/ai_town
      REDIS_URL: redis://redis:6379/0
      TZ: Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./data/logs:/app/data/logs
    networks:
      - aitown-net

  frontend:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile
    container_name: aitown-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - aitown-net

  # ============================================================
  # 可观测性层（通过 --profile observability 启用）
  # ============================================================

  prometheus:
    image: prom/prometheus:latest
    container_name: aitown-prometheus
    restart: unless-stopped
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    ports:
      - "9090:9090"
    environment:
      TZ: Asia/Shanghai
    networks:
      - aitown-net
    profiles: [observability]

  loki:
    image: grafana/loki:3.0.0
    container_name: aitown-loki
    restart: unless-stopped
    volumes:
      - ./docker/observability/loki-config.yml:/etc/loki/local-config.yaml:ro
      - ./data/loki:/loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    environment:
      TZ: Asia/Shanghai
    networks:
      - aitown-net
    profiles: [observability]

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: aitown-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      TZ: Asia/Shanghai
    ports:
      - "16686:16686" # Jaeger UI
      - "14318:4318" # OTLP HTTP
    networks:
      - aitown-net
    profiles: [observability]

  alloy:
    image: grafana/alloy:latest
    container_name: aitown-alloy
    restart: unless-stopped
    volumes:
      - ./docker/observability/alloy.config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data/logs:/var/log/aitown:ro
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    ports:
      - "12345:12345"
    environment:
      TZ: Asia/Shanghai
    depends_on:
      - loki
    networks:
      - aitown-net
    profiles: [observability]

  grafana:
    image: grafana/grafana:12.0.0
    container_name: aitown-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: ""
      TZ: Asia/Shanghai
    volumes:
      - ./docker/observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/observability/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./docker/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./data/grafana:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - jaeger
    networks:
      - aitown-net
    profiles: [observability]

networks:
  aitown-net:
    driver: bridge
