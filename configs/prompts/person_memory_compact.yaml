name: person_memory_compact
# Person Memory 主档压缩：把未压缩事实条目合并进主档（两层结构的归档层）
template: |
  你是角色的记忆系统。请把以下新事实合并进对该用户的记忆主档。

  现有主档：
  {existing_content}

  待合并的新事实：
  {facts_text}

  合并规则：
  1. 保留主档与新事实中所有仍然成立的信息，按主题组织（偏好/习惯/关系/重要事件）
  2. 相互矛盾时以新事实为准
  3. 语言精炼自然，总长不超过 400 字
  4. 不要编造任何列表之外的内容

  请输出 JSON（不要输出其他文字）：
  {{ "content": "<合并后的完整主档>" }}