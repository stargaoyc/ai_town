name: reflection
# 角色反思生成：从近期记忆归纳主题化高层认知
# 记忆带编号供 LLM 标注 grounding，每条主题反思只挂载其依据的记忆
template: |
  [记忆列表]
  {memories_text}

  [任务]
  阅读以上编号记忆，归纳出 2-4 条互不重叠的主题性高层认知。
  每条主题必须：
  - 跨越至少两条记忆，提炼出比单条记忆更抽象的规律、倾向或情感模式
  - 在 memory_ids 中列出它依据的记忆编号（只列真正支撑该主题的编号）
  - summary 是一句话主题，detail 是 2-3 句展开

  输出格式（严格 JSON）：
  {{ "reflections": [
    {{ "summary": "<主题>", "detail": "<展开>", "memory_ids": [<编号>, ...] }}
  ] }}