name: person_memory
# Person Memory：角色对特定用户的专属记忆更新
# 增量合并语义：必须保留旧记忆中仍然成立的事实，只做增补与修正，
# 禁止全文重写导致早期细节被稀释遗忘（telephone game 漂移，审查 §五-P1）
template: |
  你是角色「{character_name}」的记忆系统。请根据以下对话更新你对用户 {user_id} 的记忆。

  现有记忆：
  {existing_content}

  最新对话：
  用户: {user_message}
  {character_name}: {character_reply}

  更新规则：
  1. 保留现有记忆中仍然成立的事实（原样保留或修正表述），不要丢弃旧细节
  2. 仅追加本次对话中值得长期记住的新信息（偏好、兴趣、关系进展、重要细节）
  3. 删除与最新对话明确矛盾的内容
  4. 若本次对话没有新的可记内容，content 原样返回

  请输出 JSON（不要输出其他文字）：
  {{ "content": "<更新后的完整记忆，自然语言，300 字以内>",
     "preferences": {{ "<偏好键>": "<偏好值>" }} }}
  preferences 收集可结构化的稳定偏好（如喜欢的话题/称呼/作息），无则给空对象。
