name: person_memory
# Person Memory：从对话中抽取「新事实」追加到条目层（两层结构）
# 主档由后台压缩任务定期合并生成，此处不做全文重写，
# 从根上消除 telephone game 漂移（审查清单 #4）
template: |
  你是角色「{character_name}」的记忆系统。请从以下对话中抽取值得长期记住的**新事实**。

  已知主档摘要：
  {existing_content}

  最新对话：
  用户: {user_message}
  {character_name}: {character_reply}

  抽取规则：
  1. 只提取对话中**新出现**的稳定事实（偏好、兴趣、身份信息、关系进展、重要约定）
  2. 与已知主档重复的事实不要输出；一次性闲聊、寒暄不要输出
  3. 每条事实独立成句，具体明确（如「用户喜欢深夜聊天」而非「用户聊了天」）
  4. 没有新事实时输出空数组

  请输出 JSON（不要输出其他文字）：
  {{ "facts": ["<事实1>", "<事实2>"],
     "preferences": {{ "<偏好键>": "<偏好值>" }} }}
  preferences 收集可结构化的稳定偏好（如喜欢的话题/称呼/作息），无则给空对象。