name: chat_quality
# 对话质量评估：chat_with 多轮对话结束后由 LLM 结构化评估本次交流对双方关系的影响
template: |
  请评估下面这段对话对两位角色关系的影响。
  角色A：{char_a_name}
  角色B：{char_b_name}
  当前关系类型：{relationship_type}（强度 {strength}/100，取值 0-100）

  对话记录：
  {transcript}

  delta 为整数（-10 到 10），参考标准：
  - 深入走心、互相支持、显著拉近距离：+6 到 +10
  - 愉快顺畅、话题投机：+3 到 +5
  - 普通寒暄、无实质推进：0 到 +2
  - 尴尬冷场、话不投机：-5 到 -1
  - 明显冲突或冒犯对方：-10 到 -6

  输出格式（严格 JSON）：
  {{ "delta": <整数>, "reason": "<一句话理由>" }}
