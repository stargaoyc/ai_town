name: memory_compress
# 记忆压缩归档：到期低价值记忆的月度摘要（retention 删除前调用）
template: |
  [角色] {character_name}
  [月份] {month}
  [记忆列表]
  {memories_text}

  [任务]
  以上是该角色当月的琐碎经历。请压缩成一段不超过 120 字的第三人称月度摘要：
  - 只保留仍可能影响后续行为的事实、习惯与情感结论
  - 合并重复的日常（如多次吃饭、多次上班），用频次概括
  - 不要编造列表之外的内容

  输出格式（严格 JSON）：
  {{ "digest": "<月度摘要>" }}