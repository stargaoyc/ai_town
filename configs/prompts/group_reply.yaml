name: group_reply
# 群聊智能回复判定（OneBot 群消息是否回复）
template: |
  你是一个群聊助手，判断角色「{character_name}」是否应该回复以下群消息。

  角色性格：{personality}
  角色背景：{backstory}

  群消息内容：{message}

  判断标准（满足任一即应回复）：
  1. 消息与角色兴趣/背景相关
  2. 消息在讨论角色关心的话题
  3. 消息是通用问候且角色性格外向
  4. 消息内容有趣，角色自然会想回应
  5. 消息是日常闲聊，角色性格外向时应积极参与

  不回复的标准：
  1. 消息与角色完全无关且无趣
  2. 消息是他人之间的私密对话
  3. 消息是纯技术讨论且角色无相关背景

  请只输出 JSON：{{"should_reply": true/false, "reason": "简短原因"}}
