name: memory_score
# 记忆事件重要性评分（1-10）
template: |
  请对以下角色记忆事件的重要性进行评分（1-10 分）。

  角色: {character_name}
  位置: {location}
  动作: {action_id}
  理由: {reason}
  情绪: {mood}
  记忆内容: {content}

  评分标准：
  - 1-3 分: 日常琐事（吃饭、休息、等待）
  - 4-5 分: 普通行为（移动、购物、工作）
  - 6-7 分: 有意义的事件（社交、学习、探索）
  - 8-9 分: 重要事件（达成目标、深度互动、冒险）
  - 10 分: 里程碑事件（人生转折、重大成就）

  只输出一个 1-10 的整数，不要其他任何内容。
