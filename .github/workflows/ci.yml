name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/backend
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: aitown
          POSTGRES_PASSWORD: aitown_dev
          POSTGRES_DB: aitown
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://aitown:aitown_dev@localhost:5432/aitown
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-test-secret-at-least-32-chars-long
      OPENAI_API_KEY: sk-test-placeholder
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ci-test-password-not-default
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install 3.13
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint with ruff
        run: uv run ruff check src/ tests/
      - name: Format check with ruff
        run: uv run ruff format --check src/ tests/
      - name: Type check with mypy
        run: uv run mypy src/ tests/
      - name: Run tests
        run: uv run pytest --tb=short -q
        env:
          DATABASE_URL: postgresql+asyncpg://aitown:aitown_dev@localhost:5432/aitown
          REDIS_URL: redis://localhost:6379/0
          IT_PG_HOST: localhost
          IT_PG_PORT: "5432"
          IT_PG_USER: aitown
          IT_PG_PASSWORD: aitown_dev
          IT_REDIS_URL: redis://localhost:6379/15

  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          # 与 packages/frontend/package.json 的 packageManager 字段保持一致
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: '**/pnpm-lock.yaml'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint with oxlint
        run: pnpm run lint
      - name: Type check
        run: pnpm run typecheck
      - name: API type contract guard
        run: |
          pnpm gen:api
          git diff --exit-code -- src/types/api-generated.d.ts || (echo "后端契约变更未同步：请运行 pnpm gen:api 并提交" && exit 1)
      - name: Unit tests
        run: pnpm test -- --run
      - name: Build
        run: pnpm run build

  deploy-smoke:
    # R4-H4：部署冒烟——此前 CI 零镜像构建/零运行时验证，
    # c387487（镜像不可构建、后端容器从未成功启动）与 900c73d（nginx 运行时 502）
    # 两类事故只能靠人肉发现，本作业关闭该复发通道
    name: Deploy Smoke (build & boot)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      POSTGRES_PASSWORD: smoke-test-password
      REDIS_PASSWORD: smoke-test-password
      ENVIRONMENT: development
    steps:
      - uses: actions/checkout@v5
      - name: Validate compose config
        run: docker compose config -q
      - name: Build images
        run: docker compose build backend frontend
      - name: Boot core stack
        run: docker compose up -d postgres redis backend frontend
      - name: Wait for backend health (direct)
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8001/health > /dev/null; then echo "backend healthy"; exit 0; fi
            sleep 2
          done
          echo "backend failed to become healthy" && docker compose logs backend --tail 100 && exit 1
      - name: Wait for frontend health (through nginx proxy)
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:80/health > /dev/null; then echo "frontend proxy healthy"; exit 0; fi
            sleep 2
          done
          echo "nginx proxy failed" && docker compose logs frontend --tail 100 && exit 1
      - name: Tear down
        if: always()
        run: docker compose down -v -t 30
