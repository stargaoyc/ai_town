name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/backend
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: aitown
          POSTGRES_PASSWORD: aitown_dev
          POSTGRES_DB: aitown
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://aitown:aitown_dev@localhost:5432/aitown
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-test-secret-at-least-32-chars-long
      OPENAI_API_KEY: sk-test-placeholder
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ci-test-password-not-default
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install 3.13
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint with ruff
        run: uv run ruff check src/ tests/
      - name: Format check with ruff
        run: uv run ruff format --check src/ tests/
      - name: Type check with mypy
        run: uv run mypy src/ tests/
      - name: Run tests
        run: uv run pytest --tb=short -q
        env:
          DATABASE_URL: postgresql+asyncpg://aitown:aitown_dev@localhost:5432/aitown
          REDIS_URL: redis://localhost:6379/0
          IT_PG_HOST: localhost
          IT_PG_PORT: "5432"
          IT_PG_USER: aitown
          IT_PG_PASSWORD: aitown_dev
          IT_REDIS_URL: redis://localhost:6379/15

  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          # 与 packages/frontend/package.json 的 packageManager 字段保持一致
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: '**/pnpm-lock.yaml'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint with oxlint
        run: pnpm run lint
      - name: Type check
        run: pnpm run typecheck
      - name: API type contract guard
        run: |
          pnpm gen:api
          git diff --exit-code -- src/types/api-generated.d.ts || (echo "后端契约变更未同步：请运行 pnpm gen:api 并提交" && exit 1)
      - name: Unit tests
        run: pnpm test -- --run
      - name: Build
        run: pnpm run build
